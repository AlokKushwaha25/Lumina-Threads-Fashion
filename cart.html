<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumina Threads | Your Cart</title>
    <!-- Modern Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">

    <!-- Meta Pixel Code -->
    <script>
        !function (f, b, e, v, n, t, s) {
            if (f.fbq) return; n = f.fbq = function () {
                n.callMethod ?
                n.callMethod.apply(n, arguments) : n.queue.push(arguments)
            };
            if (!f._fbq) f._fbq = n; n.push = n; n.loaded = !0; n.version = '2.0';
            n.queue = []; t = b.createElement(e); t.async = !0;
            t.src = v; s = b.getElementsByTagName(e)[0];
            s.parentNode.insertBefore(t, s)
        }(window, document, 'script',
            'https://connect.facebook.net/en_US/fbevents.js');
        fbq('init', '1961169484470477');
    </script>
    <noscript><img height="1" width="1" style="display:none"
            src="https://www.facebook.com/tr?id=1961169484470477&ev=PageView&noscript=1" /></noscript>
    <!-- End Meta Pixel Code -->

    <script>
        window.trackPixelEvent = function (eventName, parameters) {
            console.log(`%c[Meta Pixel Hook] %c${eventName}`, "color: #1877F2; font-weight: bold;", "color: #fff; background: #333; padding: 2px 6px; border-radius: 4px;", parameters || "");
        };
    </script>
</head>

<body>

    <!-- Navigation -->
    <nav class="navbar">
        <div class="logo">
            <a href="index.html" style="text-decoration: none; color: inherit;">
                <span>Lumina</span>
                <span class="logo-accent">Threads</span>
            </a>
        </div>
        <div class="nav-links">
            <a href="products.html" class="nav-link">Shop</a>
        </div>
        <div class="nav-actions">
            <!-- Icon is just a static counter for this page -->
            <button id="cart-btn" class="cart-toggle" aria-label="Go to Cart">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="9" cy="21" r="1"></circle>
                    <circle cx="20" cy="21" r="1"></circle>
                    <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                </svg>
                <span id="cart-count">0</span>
            </button>
        </div>
    </nav>

    <main class="products-container" style="padding-top: 100px; max-width: 800px; margin: 0 auto;">
        <div class="cart-drawer-content"
            style="position: static; width: 100%; border-radius: 12px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);">
            <div class="cart-header">
                <h2>Your Cart</h2>
            </div>

            <div id="cart-items" class="cart-items-container" style="max-height: none;">
                <!-- Cart items will be injected here -->
            </div>

            <div class="cart-footer">
                <div class="cart-total">
                    <span>Total</span>
                    <span id="cart-total-price">$0.00</span>
                </div>
                <!-- Pixel Hook: InitiateCheckout -->
                <button id="checkout-btn" class="checkout-btn" disabled>Proceed to Checkout</button>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; <span id="year"></span> Lumina Threads. Demo for Meta Pixel.</p>
    </footer>

    <script src="data.js"></script>
    <script src="shared.js"></script>
    <script src="cart.js"></script>
</body>

</html>
